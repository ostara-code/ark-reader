<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>ARK — Issues</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#161616;color:#f2f2f2;font:13px/1.4 "Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;padding:40px 24px}
h1{font-size:12px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;margin:0 auto 32px;max-width:1100px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:40px 28px;max-width:1100px;margin:0 auto}
a{color:inherit;text-decoration:none}
img{width:100%;display:block;background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.5);transition:transform .2s}
a:hover img{transform:translateY(-4px)}
.t{margin-top:14px;letter-spacing:.14em;text-transform:uppercase;font-size:11px}
.s{color:#8d8d8d;font-size:11px;margin-top:4px}
</style>
</head>
<body>
<h1>ARK — Issues</h1>
<div class="grid" id="g"></div>
<script>
fetch("issues.json").then(r => r.json()).then(list => {
  const g = document.getElementById("g");
  list.forEach(i => {
    const a = document.createElement("a");
    a.href = i.slug + "/";
    a.innerHTML = `<img src="${i.slug}/t/0001.jpg" alt=""><div class="t"></div><div class="s"></div>`;
    a.querySelector(".t").textContent = i.title;
    a.querySelector(".s").textContent = (i.subtitle ? i.subtitle + " · " : "") + i.pages + " pages";
    g.appendChild(a);
  });
});
</script>
</body>
</html>
