<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{TITLE}}</title>
<link rel="icon" href="data:,">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:image" content="t/0001.jpg">
<style>
:root{--bg:#161616;--fg:#f2f2f2;--muted:#8d8d8d;--btn:rgba(255,255,255,.08);--btn-h:rgba(255,255,255,.18);--shadow:0 12px 40px rgba(0,0,0,.55)}
:root[data-theme=light]{--bg:#f3f3f1;--fg:#111;--muted:#6b6b6b;--btn:rgba(0,0,0,.06);--btn-h:rgba(0,0,0,.13);--shadow:0 10px 30px rgba(0,0,0,.18)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
  font:13px/1.3 "Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:6px;padding:8px 10px 6px 16px;min-height:50px}
.title{flex:1;min-width:0;letter-spacing:.16em;text-transform:uppercase;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px;margin:0 6px;white-space:nowrap}
.icon{appearance:none;border:0;background:var(--btn);color:var(--fg);width:34px;height:34px;border-radius:50%;
  display:inline-grid;place-items:center;cursor:pointer;padding:0;flex:none;text-decoration:none;transition:background .15s}
.icon:hover{background:var(--btn-h)}
.icon:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon[hidden]{display:none}
#stage{outline:none;position:relative;flex:1;min-height:0;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
#view{position:absolute;left:0;top:0;transform-origin:0 0}
#spread{display:flex;height:100%;box-shadow:var(--shadow);background:#fff}
#spread.dragging{transition:none}
#spread.settle{transition:transform .2s ease-out}
#spread img{display:block;height:100%;background:#fff;pointer-events:none;-webkit-user-drag:none}
#spread.two img:first-child{box-shadow:inset -14px 0 18px -14px rgba(0,0,0,.25)}
.nav{position:absolute;top:50%;margin-top:-22px;width:44px;height:44px;z-index:2}
.nav.prev{left:12px}.nav.next{right:12px}
.nav[disabled]{opacity:.25;cursor:default}
@media (hover:none) and (max-width:760px){.nav{display:none}}
footer{padding:4px 16px 12px;display:flex;align-items:center;gap:12px}
footer input{flex:1;accent-color:var(--fg);height:20px;margin:0}
#grid{position:absolute;inset:0;z-index:5;background:var(--bg);overflow:auto;display:none;padding:64px 16px 32px}
#grid.open{display:block}
#grid .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:18px 14px;max-width:1180px;margin:0 auto}
#grid .items button{all:unset;cursor:pointer;color:var(--muted);font-size:11px;text-align:center}
#grid img{width:100%;display:block;background:#fff;margin-bottom:5px;box-shadow:0 2px 10px rgba(0,0,0,.25);aspect-ratio:var(--ar)}
#grid .items button.current{color:var(--fg)}
#grid .items button.current img{outline:2px solid var(--fg);outline-offset:3px}
#grid .close{position:fixed;top:8px;right:10px;z-index:6}
#msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-size:11px;text-align:center;padding:20px}
#msg a{color:var(--fg)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title" id="title">{{TITLE}}</div>
    <span class="count" id="count"></span>
    <button class="icon" id="bGrid" title="All pages (G)" aria-label="Show all pages"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg></button>
    <button class="icon" id="bZoom" title="Zoom (Z)" aria-label="Zoom in"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5M8 10.5h5M10.5 8v5" id="zoomGlyph"/></svg></button>
    <a class="icon" id="bDownload" title="Download PDF" aria-label="Download PDF" hidden download><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg></a>
    <button class="icon" id="bFull" title="Full screen (F)" aria-label="Full screen" hidden><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
    <a class="icon" id="bOpen" title="Open in new tab" aria-label="Open in new tab" target="_blank" rel="noopener" hidden><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg></a>
  </header>
  <div id="stage" tabindex="0" aria-label="Magazine pages. Use left and right arrow keys to turn pages.">
    <div id="view"><div id="spread"></div></div>
    <button class="icon nav prev" id="bPrev" aria-label="Previous page"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="icon nav next" id="bNext" aria-label="Next page"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <div id="msg">Loading…</div>
  </div>
  <footer><input type="range" id="scrub" min="1" max="1" value="1" aria-label="Go to page"></footer>
  <div id="grid" role="dialog" aria-label="All pages">
    <button class="icon close" id="bGridClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="items" id="gridItems"></div>
  </div>
</div>
<noscript><p style="padding:20px">This reader needs JavaScript.</p></noscript>
<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const stage = $("stage"), view = $("view"), spread = $("spread"), msg = $("msg");
  const pad = n => String(n).padStart(4, "0");
  const src = (kind, i) => `${kind}/${pad(i + 1)}.jpg`;
  const params = new URLSearchParams(location.search);
  const embedded = window.self !== window.top;

  let M, N, pages, views = [], spreadMode = null, vi = 0;  // vi = current view index
  let box = { w: 0, h: 0, ox: 0, oy: 0 };                     // fitted size + offset of current view
  let z = { s: 1, x: 0, y: 0 };                               // zoom/pan transform
  let hdLoaded = false;

  /* ---------- layout ---------- */
  const wide = i => pages[i].w > pages[i].h * 1.05;
  function buildViews(two) {
    const out = [];
    if (!two) { for (let i = 0; i < N; i++) out.push([i]); return out; }
    let i = 0;
    if (M.coverAlone !== false && N) { out.push([0]); i = 1; }
    while (i < N) {
      if (!wide(i) && i + 1 < N && !wide(i + 1)) { out.push([i, i + 1]); i += 2; }
      else { out.push([i]); i += 1; }
    }
    return out;
  }
  const viewOf = page => Math.max(0, views.findIndex(v => v.includes(page)));

  function chooseMode() {
    const w = stage.clientWidth, h = stage.clientHeight;
    const two = params.get("spreads") === "0" ? false : (w >= 720 && w / h >= 1.15);
    if (two !== spreadMode) {
      const page = views.length ? views[vi][0] : startPage();
      spreadMode = two;
      views = buildViews(two);
      vi = viewOf(page);
      return true;
    }
    return false;
  }

  function fit() {
    const W = stage.clientWidth, H = stage.clientHeight;
    const v = views[vi];
    const aspect = v.reduce((a, i) => a + pages[i].w / pages[i].h, 0);
    const big = W >= 760;
    const availW = W - (big ? 140 : 12), availH = H - (big ? 28 : 10);
    const h = Math.max(50, Math.min(availH, availW / aspect));
    box = { w: h * aspect, h, ox: (W - h * aspect) / 2, oy: (H - h) / 2 };
    view.style.width = box.w + "px";
    view.style.height = box.h + "px";
    [...spread.children].forEach((img, k) => { img.style.width = (h * pages[v[k]].w / pages[v[k]].h) + "px"; });
  }

  /* ---------- zoom / pan ---------- */
  function clampZ() {
    const W = stage.clientWidth, H = stage.clientHeight;
    const sw = box.w * z.s, sh = box.h * z.s;
    // z.x / z.y are the top-left of the view in stage coordinates
    z.x = sw <= W ? (W - sw) / 2 : Math.min(0, Math.max(W - sw, z.x));
    z.y = sh <= H ? (H - sh) / 2 : Math.min(0, Math.max(H - sh, z.y));
  }
  function applyZ() {
    clampZ();
    view.style.transform = `translate(${z.x}px,${z.y}px) scale(${z.s})`;
    const zoomed = z.s > 1.01;
    stage.style.touchAction = zoomed ? "none" : "pan-y";
    stage.style.cursor = zoomed ? "grab" : "";
    $("zoomGlyph").setAttribute("d", zoomed ? "M15 15l5 5M8 10.5h5" : "M15 15l5 5M8 10.5h5M10.5 8v5");
    $("bZoom").setAttribute("aria-label", zoomed ? "Zoom out" : "Zoom in");
    if (z.s > 1.2 && !hdLoaded) loadHD();
  }
  function zoomTo(s, px, py) {
    s = Math.min(5, Math.max(1, s));
    if (px == null) { px = stage.clientWidth / 2; py = stage.clientHeight / 2; }
    z.x = px - (px - z.x) * (s / z.s);
    z.y = py - (py - z.y) * (s / z.s);
    z.s = s;
    applyZ();
  }
  function resetZ() { z = { s: 1, x: box.ox, y: box.oy }; applyZ(); }
  function loadHD() {
    hdLoaded = true;
    const v = views[vi], imgs = [...spread.children];
    v.forEach((p, k) => { const im = new Image(); im.onload = () => { if (views[vi] === v) imgs[k].src = im.src; }; im.src = src("hd", p); });
  }

  /* ---------- render ---------- */
  function render(dir = 0) {
    const v = views[vi];
    spread.innerHTML = "";
    spread.classList.toggle("two", v.length === 2);
    v.forEach(p => {
      const img = new Image();
      img.alt = `Page ${p + 1}`;
      img.decoding = "async";
      img.src = src("p", p);
      spread.appendChild(img);
    });
    hdLoaded = false;
    fit();
    resetZ();
    if (dir && spread.animate) {
      spread.animate([{ opacity: 0, transform: `translateX(${dir * 28}px)` }, { opacity: 1, transform: "none" }],
        { duration: 220, easing: "cubic-bezier(.2,.7,.2,1)" });
    }
    const label = v.length === 2 ? `${v[0] + 1}–${v[1] + 1}` : `${v[0] + 1}`;
    $("count").textContent = `${label} / ${N}`;
    $("scrub").value = v[0] + 1;
    $("bPrev").disabled = vi === 0;
    $("bNext").disabled = vi === views.length - 1;
    try { history.replaceState(null, "", "#" + (v[0] + 1)); } catch (e) {}
    preload();
  }
  function preload() {
    [vi + 1, vi + 2, vi - 1].forEach(k => { if (views[k]) views[k].forEach(p => { new Image().src = src("p", p); }); });
  }
  function go(k, dir) {
    k = Math.max(0, Math.min(views.length - 1, k));
    if (k === vi) return;
    vi = k;
    render(dir ?? 0);
  }
  const next = () => go(vi + 1, 1);
  const prev = () => go(vi - 1, -1);
  const goPage = p => go(viewOf(p), 0);
  function startPage() {
    const n = parseInt(location.hash.slice(1), 10) || parseInt(params.get("page"), 10) || 1;
    return Math.min(Math.max(n, 1), N) - 1;
  }

  /* ---------- pointer input: tap zones, swipe, double-tap zoom, pinch, pan ---------- */
  const pts = new Map();
  let g = null, lastTap = { t: 0, x: 0, y: 0 };
  const local = e => { const r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };

  stage.addEventListener("pointerdown", e => {
    if (e.target.closest("button,a")) return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    stage.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, local(e));
    if (pts.size === 1) {
      const p = local(e);
      g = { type: "one", sx: p.x, sy: p.y, zx: z.x, zy: z.y, t: Date.now(), moved: false };
      if (z.s > 1.01) stage.style.cursor = "grabbing";
    } else if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      g = { type: "pinch", d: Math.hypot(a.x - b.x, a.y - b.y), s: z.s, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, zx: z.x, zy: z.y };
      spread.style.transform = "";
    }
  });
  stage.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId) || !g) return;
    pts.set(e.pointerId, local(e));
    if (g.type === "pinch" && pts.size >= 2) {
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const s = Math.min(5, Math.max(1, g.s * d / g.d));
      z.x = mx - (g.mx - g.zx) * (s / g.s);
      z.y = my - (g.my - g.zy) * (s / g.s);
      z.s = s;
      applyZ();
      return;
    }
    if (g.type === "one") {
      const p = local(e), dx = p.x - g.sx, dy = p.y - g.sy;
      if (Math.abs(dx) > 6 || Math.abs(dy) > 6) g.moved = true;
      if (z.s > 1.01) { z.x = g.zx + dx; z.y = g.zy + dy; applyZ(); }
      else if (g.moved && Math.abs(dx) > Math.abs(dy)) {
        spread.className = "dragging" + (views[vi].length === 2 ? " two" : "");
        spread.style.transform = `translateX(${dx * 0.5}px)`;
      }
    }
  });
  function endPointer(e) {
    if (!pts.has(e.pointerId)) return;
    const p = pts.get(e.pointerId);
    pts.delete(e.pointerId);
    if (!g) return;
    if (g.type === "pinch") {
      if (pts.size === 0) { if (z.s < 1.08) resetZ(); g = null; }
      else { const q = [...pts.values()][0]; g = { type: "one", sx: q.x, sy: q.y, zx: z.x, zy: z.y, t: 0, moved: true }; }
      return;
    }
    const dx = p.x - g.sx, dy = p.y - g.sy;
    stage.style.cursor = z.s > 1.01 ? "grab" : "";
    spread.className = (views[vi].length === 2 ? "two " : "") + "settle";
    spread.style.transform = "";
    const cancelled = e.type === "pointercancel";
    if (z.s <= 1.01 && !cancelled && Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.2) {
      dx < 0 ? next() : prev();
    } else if (!g.moved && !cancelled && Date.now() - g.t < 350) {
      tap(p, e.pointerType);
    }
    g = null;
  }
  stage.addEventListener("pointerup", endPointer);
  stage.addEventListener("pointercancel", endPointer);

  function tap(p, type) {
    const now = Date.now();
    const dbl = now - lastTap.t < 320 && Math.hypot(p.x - lastTap.x, p.y - lastTap.y) < 40;
    lastTap = { t: dbl ? 0 : now, x: p.x, y: p.y };
    const W = stage.clientWidth;
    if (z.s > 1.01) { if (dbl) resetZ(); return; }
    // outer 28% of the stage turns pages immediately; double-tap in the middle zooms
    if (p.x < W * 0.28) { prev(); return; }
    if (p.x > W * 0.72) { next(); return; }
    if (dbl) zoomTo(2.5, p.x, p.y);
  }
  stage.addEventListener("dblclick", e => e.preventDefault());

  // Trackpad pinch (ctrl+wheel) zooms; wheel pans only while zoomed, so the host page can still scroll.
  stage.addEventListener("wheel", e => {
    const p = local(e);
    if (e.ctrlKey || e.metaKey) { e.preventDefault(); zoomTo(z.s * Math.exp(-e.deltaY * 0.01), p.x, p.y); return; }
    if (z.s > 1.01) { e.preventDefault(); z.x -= e.deltaX; z.y -= e.deltaY; applyZ(); }
  }, { passive: false });

  /* ---------- keyboard ---------- */
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") return;
    if ($("grid").classList.contains("open")) { if (e.key === "Escape" || e.key === "g") closeGrid(); return; }
    const k = e.key;
    if (k === "ArrowRight" || k === "PageDown" || (k === " " && !e.shiftKey)) { e.preventDefault(); z.s > 1.01 ? (z.x -= 80, applyZ()) : next(); }
    else if (k === "ArrowLeft" || k === "PageUp" || (k === " " && e.shiftKey)) { e.preventDefault(); z.s > 1.01 ? (z.x += 80, applyZ()) : prev(); }
    else if (k === "ArrowDown" && z.s > 1.01) { e.preventDefault(); z.y -= 80; applyZ(); }
    else if (k === "ArrowUp" && z.s > 1.01) { e.preventDefault(); z.y += 80; applyZ(); }
    else if (k === "Home") go(0, -1);
    else if (k === "End") go(views.length - 1, 1);
    else if (k === "+" || k === "=") zoomTo(z.s * 1.5);
    else if (k === "-") zoomTo(z.s / 1.5);
    else if (k === "z") z.s > 1.01 ? resetZ() : zoomTo(2.5);
    else if (k === "Escape") resetZ();
    else if (k === "g") openGrid();
    else if (k === "f") toggleFull();
  });

  /* ---------- toolbar ---------- */
  $("bPrev").onclick = prev;
  $("bNext").onclick = next;
  $("bZoom").onclick = () => (z.s > 1.01 ? resetZ() : zoomTo(2.5));
  $("scrub").addEventListener("input", e => goPage(+e.target.value - 1));

  const fsEl = document.documentElement;
  const canFull = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  function toggleFull() {
    if (!canFull) return;
    if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl);
  }
  $("bFull").onclick = toggleFull;

  function openGrid() {
    const wrap = $("gridItems");
    if (!wrap.childElementCount) {
      pages.forEach((pg, i) => {
        const b = document.createElement("button");
        b.innerHTML = `<img loading="lazy" alt="" src="${src("t", i)}" style="--ar:${pg.w}/${pg.h}">${i + 1}`;
        b.onclick = () => { closeGrid(); goPage(i); };
        wrap.appendChild(b);
      });
    }
    const cur = views[vi];
    [...wrap.children].forEach((b, i) => b.classList.toggle("current", cur.includes(i)));
    $("grid").classList.add("open");
    wrap.children[cur[0]].scrollIntoView({ block: "center" });
  }
  function closeGrid() { $("grid").classList.remove("open"); stage.focus({ preventScroll: true }); }
  $("bGrid").onclick = openGrid;
  $("bGridClose").onclick = closeGrid;

  /* ---------- start ---------- */
  new ResizeObserver(() => { if (!N) return; chooseMode(); render(); }).observe(stage);
  window.addEventListener("hashchange", () => { const p = startPage(); if (!views[vi].includes(p)) goPage(p); });

  fetch("manifest.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(m => {
    M = m; pages = m.pages; N = pages.length;
    document.documentElement.dataset.theme = params.get("theme") || m.theme || "dark";
    if (m.title) { document.title = m.title; $("title").textContent = m.title; }
    $("scrub").max = N;
    if (m.download) { $("bDownload").href = m.download; $("bDownload").hidden = false; }
    if (canFull) $("bFull").hidden = false;
    else if (embedded) { $("bOpen").href = location.href.split("#")[0]; $("bOpen").hidden = false; }
    msg.remove();
    chooseMode();
    render();
    if (!embedded) stage.focus({ preventScroll: true });
  }).catch(() => { msg.innerHTML = "Could not load this issue."; });
})();
</script>
</body>
</html>
